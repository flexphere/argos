name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行で deploy が衝突しないよう直列化。in-flight な deploy は止めない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # husky の prepare スクリプトを CI でスキップ (git hook は CI に不要)
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 成果物は dist/index.html 1 枚のみ。アセットが外部ファイルに分かれないため
      # basePath 指定も .nojekyll も不要 (docs/adr/0001-vite-singlefile-html.md)
      - run: pnpm build

      - uses: actions/configure-pages@v6
        with:
          # Pages が repo 設定で未有効でもワークフローから自動有効化する
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
