name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一 PR で連続 push した場合、古い run は不要なのでキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # husky の prepare スクリプトを CI でスキップ (git hook は CI に不要)
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Biome
        run: npx biome check .

      - name: Unit tests
        run: npm test

      - name: Dead code (knip)
        run: npm run check:dead

      - name: Playwright ブラウザの取得
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test --reporter=line

      # git track している生成物が src/ の現在の内容と一致しているかを検証する。
      # ビルドが決定的であること (OS / Node のメジャーが変わっても SHA-256 が
      # 一致すること) を PR #1 で確認済みなので、バイト一致で判定してよい。
      # 詳細は docs/adr/0002-bundle-html-in-plugin.md。
      - name: 生成物の鮮度を検証
        run: |
          pnpm build
          pnpm build:skill
          if ! git diff --quiet -- .claude/skills/argos/assets/argos.html .claude/skills/argos/scripts/save-fixture.mjs .claude/skills/argos/scripts/embed-fixture.mjs; then
            echo "::error::git track している生成物が src/ の内容と一致していません。ローカルで 'pnpm build && pnpm build:skill' を実行し、差分をコミットしてください。"
            git --no-pager diff --stat -- .claude/skills/argos/assets/argos.html .claude/skills/argos/scripts/save-fixture.mjs .claude/skills/argos/scripts/embed-fixture.mjs
            exit 1
          fi
          echo "生成物は最新です"

      - name: Playwright レポートの保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 生成物を変えたのに plugin.json の version を据え置くと、auto-update を
  # 有効にしている利用者にも更新が届かない (third-party marketplace の
  # auto-update は既定オフで、version を bump しない限り更新されない)。
  # 「CI は緑だが誰にも届かない更新」を防ぐためのガード。
  # base との比較が要るため pull_request のときだけ走らせる。
  version-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成物を変えたら version が上がっているかを検証
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE="origin/${BASE_REF}"
          if git diff --quiet "${BASE}...HEAD" -- .claude/skills/argos/assets/argos.html .claude/skills/argos/scripts/save-fixture.mjs .claude/skills/argos/scripts/embed-fixture.mjs; then
            echo "配布される生成物に変更がないため version bump は不要です"
            exit 0
          fi
          BASE_VERSION=$(git show "${BASE}:.claude-plugin/plugin.json" | jq -r .version)
          HEAD_VERSION=$(jq -r .version .claude-plugin/plugin.json)
          echo "base: ${BASE_VERSION} / head: ${HEAD_VERSION}"
          if [ "${BASE_VERSION}" = "${HEAD_VERSION}" ]; then
            echo "::error::配布される生成物が変わっているのに .claude-plugin/plugin.json の version が ${HEAD_VERSION} のままです。version を bump しない限り利用者に更新が届きません。基準は UI 変更=patch / skill 仕様変更=minor / 互換破壊=major です。"
            exit 1
          fi
          echo "version は ${BASE_VERSION} から ${HEAD_VERSION} に更新されています"
