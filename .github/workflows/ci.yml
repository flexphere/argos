name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一 PR で連続 push した場合、古い run は不要なのでキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # husky の prepare スクリプトを CI でスキップ (git hook は CI に不要)
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Biome
        run: npx biome check .

      - name: Unit tests
        run: npm test

      - name: Dead code (knip)
        run: npm run check:dead

      - name: Playwright ブラウザの取得
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test --reporter=line

      # ADR 0002 の前提「ビルドは決定的」を Ubuntu でも確認する。
      # 手元 (macOS / Node 24・22) の実測値と一致しなければ、生成物の鮮度を
      # バイト一致で検証する方式そのものが成立しないため、生成物を repo に
      # コミットする前にここで判明させる。
      - name: ビルドの決定性を確認
        run: |
          pnpm build
          echo "--- dist/index.html SHA-256 ---"
          sha256sum dist/index.html
          echo "--- 手元の実測値 (macOS / Node 24.18.1 / 22.22.2) ---"
          echo "41dbfcfb0d9218874f2d2549b221b94e5a49d21f1620c9829b7d3900ecabc1d0"

      - name: Playwright レポートの保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
